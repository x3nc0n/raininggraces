name: Deploy to Azure Static Web Apps + Update DNS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --future

      # OIDC login is needed for Azure deployment and hostname lookup below.
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "GitHub OIDC token request context is not available." >&2
            exit 1
          fi

          token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" -H "Accept: application/json" "${ACTIONS_ID_TOKEN_REQUEST_URL}" | python3 -c 'import sys, json; print(json.load(sys.stdin)["value"])')"
          if [ -z "$token" ]; then
            echo "Failed to acquire a GitHub OIDC token." >&2
            exit 1
          fi

          echo "::add-mask::$token"
          echo "github_oidc_token=$token" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        shell: bash
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}" \
            --federated-token "${{ steps.oidc.outputs.github_oidc_token }}" \
            --allow-no-subscriptions

          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Deploy built site to Azure Static Web Apps
        shell: bash
        run: |
          set -euo pipefail
          deployment_token=$(az staticwebapp secrets list \
            --name swa-raininggraces-main \
            --resource-group rg-raininggraces-centralus \
            --query properties.apiKey \
            --output tsv)

          npx -y @azure/static-web-apps-cli deploy _site \
            --app-location . \
            --deployment-token "$deployment_token" \
            --app-name swa-raininggraces-main \
            --resource-group rg-raininggraces-centralus \
            --subscription-id "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}" \
            --env production

      - name: Get SWA default hostname
        id: swa
        run: |
          hostname=$(az staticwebapp show \
            --name swa-raininggraces-main \
            --resource-group rg-raininggraces-centralus \
            --query defaultHostname \
            --output tsv)
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"
          echo "SWA hostname: $hostname"
      - name: Register custom domains
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          SWA_NAME="swa-raininggraces-main"
          RG="rg-raininggraces-centralus"

          default_hostname=$(az staticwebapp show --name "$SWA_NAME" --resource-group "$RG" --query defaultHostname --output tsv)
          echo "SWA default hostname: $default_hostname"

          upsert_cf_txt() {
            local name="$1"
            local content="$2"
            response=$(curl -fsS -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?type=TXT&name=${name}" -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
            record_id=$(echo "$response" | jq -r '.result[0].id // empty')
            payload=$(jq -n --arg name "$name" --arg content "$content" '{type:"TXT",name:$name,content:$content,ttl:60,proxied:false}')
            if [ -n "$record_id" ]; then
              curl -fsS -X PUT "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${record_id}" -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" --data "$payload" >/dev/null
            else
              curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" --data "$payload" >/dev/null
            fi
          }

          upsert_cf_cname() {
            local name="$1"
            local content="$2"
            response=$(curl -fsS -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?type=CNAME&name=${name}" -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
            record_id=$(echo "$response" | jq -r '.result[0].id // empty')
            payload=$(jq -n --arg name "$name" --arg content "$content" '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:false}')
            if [ -n "$record_id" ]; then
              curl -fsS -X PUT "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${record_id}" -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" --data "$payload" >/dev/null
            else
              curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" --data "$payload" >/dev/null
            fi
          }

          upsert_cf_caa() {
            local name="$1"
            local issuer="$2"
            response=$(curl -fsS -X GET "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?type=CAA&name=${name}" -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json")
            existing=$(echo "$response" | jq -r --arg issuer "$issuer" '.result[] | select(.data.tag == "issue" and .data.value == $issuer) | .id' | head -n 1)
            if [ -n "$existing" ]; then
              return 0
            fi
            payload=$(jq -n --arg name "$name" --arg issuer "$issuer" '{type:"CAA",name:$name,ttl:1,proxied:false,data:{flags:0,tag:"issue",value:$issuer}}')
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" --data "$payload" >/dev/null
          }

          for domain in "raininggraces.com" "www.raininggraces.com"; do
            upsert_cf_caa "$domain" "letsencrypt.org"
            upsert_cf_caa "$domain" "digicert.com"
          done

          upsert_cf_cname "www.raininggraces.com" "$default_hostname"

          az staticwebapp hostname set --name "$SWA_NAME" --resource-group "$RG" --hostname "www.raininggraces.com" --validation-method "cname-delegation" --output none

          validation_token=$(az staticwebapp hostname show --name "$SWA_NAME" --resource-group "$RG" --hostname "raininggraces.com" --query validationToken --output tsv 2>/dev/null || true)
          if [ -n "$validation_token" ]; then
            upsert_cf_txt "raininggraces.com" "$validation_token"
            upsert_cf_txt "asuid.raininggraces.com" "$validation_token"
          fi

          az staticwebapp hostname set --name "$SWA_NAME" --resource-group "$RG" --hostname "raininggraces.com" --validation-method "dns-txt-token" --output none

      - name: Set Cloudflare SSL mode to Full
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/settings/ssl" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"value":"full"}')
          if [ "$(echo "$result" | jq -r '.success')" = "true" ]; then
            echo "✅ Cloudflare SSL mode set to Full"
          else
            echo "⚠️ SSL mode update: $(echo "$result" | jq -r '.errors[]?.message // .')"
          fi

      - name: Update Cloudflare DNS → Azure
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SWA_HOSTNAME: ${{ steps.swa.outputs.hostname }}
        shell: bash
        run: |
          set -euo pipefail

          # Verify token works before attempting any writes.
          echo "Verifying Cloudflare token..."
          verify=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")
          if [ "$(echo "$verify" | jq -r '.success')" != "true" ]; then
            echo "❌ Cloudflare token verification failed:"
            echo "$verify" | jq -r '.errors[]?.message // .messages[]?.text // .'
            echo ""
            echo "Fix: In Cloudflare dashboard, create an API token using the"
            echo "'Edit zone DNS' template, scoped to zone raininggraces.com."
            echo "Then update the CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi
          echo "✅ Token verified: $(echo "$verify" | jq -r '.result.status')"

          # Confirm token can read the target zone (catches wrong Zone ID or missing Zone:Read).
          echo "Checking zone access..."
          zone_check=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")
          if [ "$(echo "$zone_check" | jq -r '.success')" != "true" ]; then
            echo "❌ Cannot read zone ${CF_ZONE_ID}:"
            echo "$zone_check" | jq -r '.errors[]?.message // .'
            echo "Zone ID in use: ${CF_ZONE_ID}"
            echo "Fix: Token needs Zone:Zone:Read AND Zone:DNS:Edit permissions scoped to raininggraces.com"
            echo ""
            echo "Listing zones accessible with this token to find the correct Zone ID:"
            curl -s -X GET \
              "https://api.cloudflare.com/client/v4/zones?per_page=50" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              | jq -r '.result[] | "\(.name)  →  Zone ID: \(.id)"'
            exit 1
          fi
          echo "✅ Zone confirmed: $(echo "$zone_check" | jq -r '.result.name')"
          # Exits non-zero if Cloudflare returns success:false.
          upsert_cname() {
            local record_name="$1"
            local content="$2"

            response=$(curl -s -X GET \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?type=CNAME&name=${record_name}" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json")

            record_id=$(echo "$response" | jq -r '.result[0].id // empty')

            payload=$(jq -n \
              --arg type "CNAME" \
              --arg name "$record_name" \
              --arg content "$content" \
              --argjson proxied true \
              --argjson ttl 1 \
              '{type: $type, name: $name, content: $content, proxied: $proxied, ttl: $ttl}')

            if [ -n "$record_id" ]; then
              echo "Updating existing CNAME ${record_name} → ${content}"
              result=$(curl -s -X PUT \
                "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records/${record_id}" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$payload")
            else
              echo "Creating new CNAME ${record_name} → ${content}"
              result=$(curl -s -X POST \
                "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$payload")
            fi

            if [ "$(echo "$result" | jq -r '.success')" != "true" ]; then
              echo "❌ Failed to upsert ${record_name}:"
              echo "$result" | jq -r '.errors[]?.message // .'
              exit 1
            fi
            echo "  ✅ ${record_name} → ${content}"
          }

          # Apex domain — Cloudflare flattens CNAME at root automatically.
          upsert_cname "raininggraces.com"     "$SWA_HOSTNAME"
          upsert_cname "www.raininggraces.com" "$SWA_HOSTNAME"

          echo "✅ DNS updated: raininggraces.com + www → $SWA_HOSTNAME"
